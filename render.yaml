services:
  - type: web
    name: wolskia-backend
    runtime: python
    plan: free
    rootDir: WOLSKIA_Integrado/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WOLSKIA_ALLOW_REMOTE
        value: "1"
      - key: WOLSKIA_PROXY_SECRET
        generateValue: true
      - key: WOLSKIA_DAILY_CAP
        value: "300"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
